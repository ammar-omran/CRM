<page-header [title]="'adminTicketsList' | translate" [subtitle]="'tickets.subtitle' | translate">
  <app-list-actions [showFilter]="true" [activeCount]="activeFilterCount" (filterToggled)="toggleFilter()"></app-list-actions>
</page-header>

<div class="filter-container" [class.active]="filterVisible">
  <app-filter
    [isPrimary]="true"
    [controls]="filterControls"
    [showAllOption]="true"
    [resetBtn]="true"
    (filterChanged)="onFilterChanged($event)"
  ></app-filter>
</div>

<app-adaptive-table
  [apiUrl]="endpoint"
  [httpMethod]="httpVerb"
  [filters]="filters"
  [columns]="columns"
  [isLoading]="false"
  emptyTitle="No tickets found"
  emptyDescription="Try adjusting your filters or check back later for new tickets."
  noResultText="No tickets match your filters"
></app-adaptive-table>
