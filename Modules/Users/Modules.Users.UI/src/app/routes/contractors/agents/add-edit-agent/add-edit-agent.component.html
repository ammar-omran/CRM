<form [formGroup]="agentForm" (ngSubmit)="onSubmit()" class="custom-form">
  <mat-card class="card-border">
    <div class="mb-4">
      <mat-card-title class="secondary-title mb-1">
        {{ 'add_agent' | translate }}
      </mat-card-title>
      <p class="text-muted small">{{ 'add_agent_hint' | translate }}</p>
    </div>
    <mat-card-content>
      <mat-form-field color="accent" appearance="outline" class="w-100">
        <mat-label>{{ 'user_id' | translate }}</mat-label>
        <input matInput formControlName="userId" placeholder="e.g. 3fa85f64-5717-4562-b3fc-2c963f66afa6" />
        @if (agentForm.controls.userId.hasError('required')) {
          <mat-error>{{ 'validations.required' | translate }}</mat-error>
        }
      </mat-form-field>
      <p class="text-muted small">{{ 'agent_user_id_help' | translate }}</p>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="agentForm.invalid || isSubmitting"
      >
        @if (isSubmitting) {
          {{ 'loading' | translate }}
        } @else {
          {{ 'submit' | translate }}
        }
      </button>
    </mat-card-content>
  </mat-card>
</form>
