<div class="page-header">
  @if (!hideBreadcrumb && nav.length) {
    <breadcrumb [nav]="nav" class="page-header__breadcrumb" />
  }
  <div class="page-header__main">
    <div class="page-header__titles">
      <h1 class="page-header__title">
        <span class="page-header__title-text">{{ title | translate }}</span>
        @if (addLink) {
          <a
            mat-mini-fab
            color="primary"
            [routerLink]="[addLink]"
            class="page-header__add"
            [matTooltip]="addTooltip"
          >
            <mat-icon>{{ addIcon }}</mat-icon>
          </a>
        }
      </h1>
      @if (subtitle) {
        <p class="page-header__subtitle">{{ subtitle | translate }}</p>
      }
    </div>
    <div class="page-header__actions">
      <ng-content />
    </div>
  </div>
</div>
