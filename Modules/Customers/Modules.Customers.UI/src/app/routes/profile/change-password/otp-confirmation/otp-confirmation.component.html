<div class="d-flex w-100 h-100 otp-confirmation-container text-center spacer-d1">
  <div class="spacer-d1">
    <div class="logo mb-5 ">
    <img src="assets/images/svgs/Logo.svg" alt="Logo" />
  </div>

  <mat-card class="otp-confirmation-box ">
    <mat-card-header class="center-elem bg-primary">
      <mat-card-title>{{ 'confirm_email_title' | translate }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="emailConfirmationFormGroub"  class="custom-form">
        <div class="row justify-content-center">
          <div class="col-md-9 col-lg-8">
            <mat-card class="card-border card">
              <mat-card-content>
                <mat-form-field color="accent" appearance="outline" hideRequiredMarker="true">
                  <mat-label>{{ 'code' | translate }}</mat-label>
                  <input type="number" matInput formControlName="otp">
                  <mat-icon matPrefix>email</mat-icon>
                  @if (emailConfirmationFormGroub.controls.otp.errors?.required) {
                    <mat-error>{{ 'send_email_required' | translate }}</mat-error>
                   }
                </mat-form-field>
                <mat-label>{{ 'validation_of_code' | translate }} {{OTPExpiration}} {{'minute'  | translate }}</mat-label>
                <div class="justify-content-center">
                  <button
                  mat-raised-button
                  color="primary"
                  class="button"
                  (click)="optConfirmation()"
                  [disabled]="emailConfirmationFormGroub.invalid"
                  >
                  {{ 'confirm_email_button' | translate }}
                </button>
                </div>
              </mat-card-content>
            </mat-card>
          </div>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
  </div>
</div>
